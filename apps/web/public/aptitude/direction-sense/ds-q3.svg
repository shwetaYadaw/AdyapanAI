<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 160" fill="none">
  <style>text{font-family:Arial,sans-serif;font-size:11px;fill:#333}.line{stroke:#333;stroke-width:1.2}</style>
  <!-- Original compass -->
  <text x="70" y="15">N-W</text><text x="100" y="15">N</text><text x="125" y="15">N-E</text>
  <text x="75" y="45">W</text><text x="105" y="45">+</text><text x="130" y="45">E</text>
  <text x="70" y="75">S-W</text><text x="100" y="75">S</text><text x="125" y="75">S-E</text>
  <!-- Arrow -->
  <text x="175" y="45" font-size="16">→</text>
  <!-- New compass (rotated 135° clockwise: SE→N, NE→W, W→SE) -->
  <text x="230" y="15">S</text><text x="255" y="15">W</text>
  <text x="210" y="45">S-E</text><text x="248" y="45">+</text><text x="270" y="45">N-W</text>
  <text x="230" y="75">E</text><text x="255" y="75">N</text>
  <text x="30" y="120" font-size="11" fill="#1565c0">SE→N, NE→W, so each direction rotates 135° clockwise.</text>
  <text x="30" y="140" font-size="11" fill="#1565c0">W rotates 135° clockwise → becomes South-East.</text>
</svg>
