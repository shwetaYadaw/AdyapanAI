<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 220" fill="none">
  <style>text{font-family:Arial,sans-serif;font-size:11px;fill:#333}.arrow{stroke:#333;stroke-width:1.5;marker-end:url(#arr)}.dot{fill:#333}</style>
  <defs><marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#333"/></marker></defs>
  <!-- Dev, Kumar, Nilesh, Ankur, Pintu layout -->
  <!-- Nilesh←25m→Ankur←40m→Kumar    90m→(right of Kumar) -->
  <circle class="dot" cx="30" cy="120" r="4"/><text x="20" y="138">Nilesh</text>
  <line class="arrow" x1="35" y1="120" x2="80" y2="120"/>
  <text x="45" y="113" font-size="10">25m</text>
  <circle class="dot" cx="85" cy="120" r="4"/><text x="75" y="138">Ankur</text>
  <line class="arrow" x1="90" y1="120" x2="150" y2="120"/>
  <text x="110" y="113" font-size="10">40m</text>
  <circle class="dot" cx="155" cy="120" r="4"/><text x="148" y="138">Kumar</text>
  <!-- Dev is 60m south of Kumar -->
  <line class="arrow" x1="155" y1="125" x2="155" y2="175"/>
  <text x="160" y="155" font-size="10">60m</text>
  <circle class="dot" cx="155" cy="178" r="4"/><text x="148" y="193">Dev</text>
  <!-- Pintu is 90m north of Dev = 30m north of Kumar -->
  <line class="arrow" x1="155" y1="115" x2="155" y2="60"/>
  <text x="160" y="90" font-size="10">30m north</text>
  <circle class="dot" cx="155" cy="55" r="4"/><text x="148" y="48">Pintu</text>
  <!-- 90m right of Kumar -->
  <text x="165" y="123" font-size="10">←90m→</text>
  <text x="30" y="210" font-size="11" fill="#1565c0">Ankur is left of Kumar. Pintu is North-East of Ankur.</text>
</svg>
