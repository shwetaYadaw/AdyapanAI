<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 220" fill="none">
  <style>text{font-family:Arial,sans-serif;font-size:11px;fill:#333}.arrow{stroke:#333;stroke-width:1.5;marker-end:url(#arr)}.dot{fill:#333}</style>
  <defs><marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#333"/></marker></defs>
  <!-- Jayant: West 15m, Left(S) 20m, Left(E) 15m, Right(S) 12m -->
  <circle class="dot" cx="200" cy="60" r="4"/><text x="205" y="58">X(start)</text>
  <line class="arrow" x1="195" y1="60" x2="110" y2="60"/>
  <text x="140" y="53" font-size="10">15m W</text>
  <circle class="dot" cx="105" cy="60" r="4"/><text x="93" y="53">A</text>
  <line class="arrow" x1="105" y1="65" x2="105" y2="120"/>
  <text x="110" y="97" font-size="10">20m S</text>
  <circle class="dot" cx="105" cy="125" r="4"/><text x="93" y="133">B</text>
  <line class="arrow" x1="110" y1="125" x2="195" y2="125"/>
  <text x="140" y="118" font-size="10">15m E</text>
  <circle class="dot" cx="200" cy="125" r="4"/><text x="205" y="133">C</text>
  <line class="arrow" x1="200" y1="130" x2="200" y2="175"/>
  <text x="205" y="157" font-size="10">12m S</text>
  <circle class="dot" cx="200" cy="178" r="4"/><text x="205" y="186">D</text>
  <!-- Distance from X to D -->
  <line x1="200" y1="63" x2="200" y2="175" stroke="#c00" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="155" y="175" font-size="11" fill="#1565c0">XD = 20+12 = 32m South</text>
</svg>
