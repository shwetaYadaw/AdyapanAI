<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" fill="none">
  <style>text{font-family:Arial,sans-serif;font-size:11px;fill:#333}.arrow{stroke:#333;stroke-width:1.5;marker-end:url(#arr)}.dot{fill:#333}</style>
  <defs><marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#333"/></marker></defs>
  <!-- Rasik: North 20m → A, Right(E) 30m → B-C, Right(S) 35m → D, Left(E) 15m → E, Left(N) 15m → F -->
  <circle class="dot" cx="80" cy="170" r="4"/><text x="72" y="186">A(start)</text>
  <line class="arrow" x1="80" y1="165" x2="80" y2="100"/>
  <text x="85" y="135" font-size="10">20m N</text>
  <circle class="dot" cx="80" cy="95" r="4"/><text x="72" y="88">B</text>
  <line class="arrow" x1="85" y1="95" x2="155" y2="95"/>
  <text x="108" y="88" font-size="10">30m E</text>
  <circle class="dot" cx="160" cy="95" r="4"/><text x="162" y="88">C</text>
  <line class="arrow" x1="160" y1="100" x2="160" y2="160"/>
  <text x="165" y="132" font-size="10">35m S</text>
  <circle class="dot" cx="160" cy="165" r="4"/><text x="162" y="178">D</text>
  <line class="arrow" x1="165" y1="165" x2="205" y2="165"/>
  <text x="177" y="158" font-size="10">15m E</text>
  <circle class="dot" cx="210" cy="165" r="4"/><text x="212" y="178">E</text>
  <line class="arrow" x1="210" y1="160" x2="210" y2="115"/>
  <text x="215" y="142" font-size="10">15m N</text>
  <circle class="dot" cx="210" cy="110" r="4"/><text x="212" y="107">F</text>
  <text x="30" y="210" font-size="11" fill="#1565c0">Distance AF = 30+15 = 45m East of A</text>
</svg>
