<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" fill="none">
  <style>text{font-family:Arial,sans-serif;font-size:12px;fill:#333}.arrow{stroke:#333;stroke-width:1.5;marker-end:url(#arr)}</style>
  <defs><marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#333"/></marker></defs>
  <!-- X is North of Z, Y is East of X -->
  <text x="20" y="40">X</text><line class="arrow" x1="40" y1="35" x2="120" y2="35"/><text x="125" y="40">Y</text>
  <text x="20" y="42" font-size="10" fill="#555">(North of Z)</text>
  <line class="arrow" x1="25" y1="45" x2="25" y2="100"/>
  <text x="20" y="115">Z</text>
  <line class="arrow" x1="25" y1="120" x2="25" y2="165"/>
  <text x="20" y="180">P</text>
  <text x="80" y="80" font-size="10" fill="#555">(South of Z)</text>
  <text x="30" y="155" font-size="11" fill="#1565c0">P is South-West of Y</text>
</svg>
