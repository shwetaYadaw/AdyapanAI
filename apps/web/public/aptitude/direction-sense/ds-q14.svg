<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 220" fill="none">
  <style>text{font-family:Arial,sans-serif;font-size:11px;fill:#333}.arrow{stroke:#333;stroke-width:1.5;marker-end:url(#arr)}.dot{fill:#333}</style>
  <defs><marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#333"/></marker></defs>
  <!-- P # R $ A * U: P→R right, R→A north, A→U left(west) -->
  <circle class="dot" cx="40" cy="160" r="4"/><text x="32" y="177">P</text>
  <line class="arrow" x1="45" y1="160" x2="105" y2="160"/>
  <text x="65" y="152" font-size="10">1m (#=right)</text>
  <circle class="dot" cx="110" cy="160" r="4"/><text x="115" y="177">R</text>
  <line class="arrow" x1="110" y1="155" x2="110" y2="80"/>
  <text x="115" y="120" font-size="10">1m ($=north)</text>
  <circle class="dot" cx="110" cy="75" r="4"/><text x="115" y="72">A</text>
  <line class="arrow" x1="105" y1="75" x2="45" y2="75"/>
  <text x="60" y="68" font-size="10">1m (*=left)</text>
  <circle class="dot" cx="40" cy="75" r="4"/><text x="22" y="72">U</text>
  <text x="30" y="205" font-size="11" fill="#1565c0">U is directly North of P</text>
</svg>
