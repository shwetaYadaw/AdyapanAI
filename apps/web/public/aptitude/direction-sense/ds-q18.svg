<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" fill="none">
  <style>text{font-family:Arial,sans-serif;font-size:11px;fill:#333}.arrow{stroke:#333;stroke-width:1.5;marker-end:url(#arr)}.dot{fill:#333}</style>
  <defs><marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#333"/></marker></defs>
  <!-- Evening sun sets in West → shadows fall East (right) -->
  <text x="20" y="60">Rekha</text>
  <line x1="20" y1="75" x2="20" y2="115" stroke="#333" stroke-width="1.5"/>
  <line class="arrow" x1="20" y1="90" x2="80" y2="90"/>
  <text x="85" y="93" font-size="10">Hema's shadow (East)</text>
  <text x="20" y="130">Hema</text>
  <!-- Compass -->
  <text x="185" y="60" font-size="11">N</text>
  <line x1="193" y1="63" x2="193" y2="78" stroke="#333" stroke-width="1.5"/>
  <line x1="183" y1="73" x2="203" y2="73" stroke="#333" stroke-width="1.5"/>
  <text x="205" y="76" font-size="11">E</text>
  <text x="182" y="87" font-size="11">S</text>
  <text x="170" y="76" font-size="11">W</text>
  <text x="20" y="160" font-size="11" fill="#1565c0">Evening: sun sets West → shadows fall East (to right of Hema). Rekha faces South.</text>
</svg>
