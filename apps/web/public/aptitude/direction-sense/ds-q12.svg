<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" fill="none">
  <style>text{font-family:Arial,sans-serif;font-size:11px;fill:#333}.arrow{stroke:#333;stroke-width:1.5;marker-end:url(#arr)}.dot{fill:#333}</style>
  <defs><marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#333"/></marker></defs>
  <!-- X @ B = B is 1m south of X → B is south of X -->
  <!-- X @ B * P: X→B south, B→P left(west) -->
  <circle class="dot" cx="150" cy="40" r="4"/><text x="155" y="43">X</text>
  <line class="arrow" x1="150" y1="45" x2="150" y2="95"/>
  <text x="155" y="75" font-size="10">1m (south)</text>
  <circle class="dot" cx="150" cy="100" r="4"/><text x="155" y="103">B</text>
  <line class="arrow" x1="145" y1="100" x2="80" y2="100"/>
  <text x="100" y="93" font-size="10">1m (left/west)</text>
  <circle class="dot" cx="75" cy="100" r="4"/><text x="63" y="103">P</text>
  <text x="30" y="140" font-size="11" fill="#1565c0">P is South-West of X (diagonal)</text>
</svg>
