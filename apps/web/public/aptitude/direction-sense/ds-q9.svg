<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" fill="none">
  <style>text{font-family:Arial,sans-serif;font-size:11px;fill:#333}.arrow{stroke:#333;stroke-width:1.5;marker-end:url(#arr)}.dot{fill:#333}</style>
  <defs><marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#333"/></marker></defs>
  <!-- Trees layout: two rows facing N and S -->
  <!-- North row: Banana Guava [gap] [gap] Raspberry -->
  <circle class="dot" cx="40" cy="80" r="4"/><text x="28" y="98">Banana</text>
  <circle class="dot" cx="100" cy="80" r="4"/><text x="90" y="98">Guava</text>
  <circle class="dot" cx="220" cy="80" r="4"/><text x="208" y="98">Raspberry</text>
  <!-- South row: Mango Lemon Apple [Papaya/Pomegranate] -->
  <circle class="dot" cx="40" cy="130" r="4"/><text x="30" y="148">Mango</text>
  <circle class="dot" cx="100" cy="130" r="4"/><text x="90" y="148">Lemon</text>
  <circle class="dot" cx="160" cy="130" r="4"/><text x="152" y="148">Apple</text>
  <!-- Papaya/Pomegranate above and below Apple -->
  <line class="arrow" x1="160" y1="125" x2="160" y2="40"/>
  <text x="120" y="30">Papaya or Pomegranate</text>
  <line class="arrow" x1="160" y1="135" x2="160" y2="185"/>
  <text x="120" y="198">Papaya or Pomegranate</text>
  <text x="30" y="175" font-size="11" fill="#1565c0">Apple is just next to Lemon. Mango is opposite to Banana.</text>
</svg>
