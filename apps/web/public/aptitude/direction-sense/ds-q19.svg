<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 220" fill="none">
  <style>text{font-family:Arial,sans-serif;font-size:11px;fill:#333}.arrow{stroke:#333;stroke-width:1.5;marker-end:url(#arr)}.dot{fill:#333}</style>
  <defs><marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#333"/></marker></defs>
  <!-- Boy: North(unknown)→A, Left(W) 1km→B, Left(S) 2km→C(at 1km west of start) -->
  <circle class="dot" cx="160" cy="170" r="4"/><text x="162" y="183">A(start)</text>
  <line class="arrow" x1="160" y1="165" x2="160" y2="80"/>
  <text x="165" y="125" font-size="10">? km N</text>
  <circle class="dot" cx="160" cy="75" r="4"/><text x="162" y="68">B</text>
  <line class="arrow" x1="155" y1="75" x2="100" y2="75"/>
  <text x="115" y="68" font-size="10">1km W</text>
  <circle class="dot" cx="95" cy="75" r="4"/><text x="78" y="68">C</text>
  <line class="arrow" x1="95" y1="80" x2="95" y2="170"/>
  <text x="100" y="128" font-size="10">2km S</text>
  <circle class="dot" cx="95" cy="173" r="4"/><text x="78" y="183">D</text>
  <!-- 1km west of start -->
  <line x1="95" y1="173" x2="157" y2="173" stroke="#c00" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="100" y="168" font-size="10" fill="#c00">1km</text>
  <text x="30" y="210" font-size="11" fill="#1565c0">D is 1km west of A. CB=1km, so AB=CD=2km. Boy rode 2km North.</text>
</svg>
