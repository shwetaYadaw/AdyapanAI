<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" fill="none">
  <style>text{font-family:Arial,sans-serif;font-size:12px;fill:#333}.line{stroke:#333;stroke-width:1.5}.arrow{stroke:#333;stroke-width:1.5;marker-end:url(#arr)}</style>
  <defs><marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#333"/></marker></defs>
  <!-- Udai and Vishal face each other -->
  <text x="20" y="60">Udai</text>
  <line class="line" x1="20" y1="75" x2="20" y2="120"/>
  <line class="arrow" x1="20" y1="75" x2="80" y2="75"/>
  <text x="85" y="78" font-size="10">Vishal's Shadow</text>
  <text x="20" y="135">Vishal</text>
  <line class="line" x1="20" y1="118" x2="20" y2="130"/>
  <!-- Compass -->
  <text x="190" y="60" font-size="11">N</text>
  <line x1="198" y1="63" x2="198" y2="85" stroke="#333" stroke-width="1.5"/>
  <line x1="186" y1="74" x2="210" y2="74" stroke="#333" stroke-width="1.5"/>
  <text x="212" y="77" font-size="11">E</text>
  <text x="185" y="92" font-size="11">S</text>
  <text x="173" y="77" font-size="11">W</text>
  <text x="30" y="165" font-size="11" fill="#1565c0">Morning sun is in East → shadow falls West. Vishal's shadow is to Udai's left (East). Udai faces North.</text>
</svg>
