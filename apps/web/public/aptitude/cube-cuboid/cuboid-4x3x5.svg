<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
  <style>text{font-family:Arial,sans-serif;font-size:11px;fill:#333}.dashed{stroke:#999;stroke-width:1;stroke-dasharray:4,3}</style>
  <!-- Cuboid 4x3x5 (L=4, B=3, H=5) -->
  <!-- Front face (Blue, 4x3) -->
  <polygon points="30,70 150,70 150,220 30,220" fill="#e3f2fd" stroke="#333" stroke-width="1.5"/>
  <!-- Top face (Red, 4x3) -->
  <polygon points="30,70 150,70 190,40 70,40" fill="#ffebee" stroke="#333" stroke-width="1.5"/>
  <!-- Right face (Green, 3x5) -->
  <polygon points="150,70 190,40 190,190 150,220" fill="#e8f5e9" stroke="#333" stroke-width="1.5"/>
  <!-- Grid on front 4x5 -->
  <line class="dashed" x1="60" y1="70" x2="60" y2="220"/>
  <line class="dashed" x1="90" y1="70" x2="90" y2="220"/>
  <line class="dashed" x1="120" y1="70" x2="120" y2="220"/>
  <line class="dashed" x1="30" y1="100" x2="150" y2="100"/>
  <line class="dashed" x1="30" y1="130" x2="150" y2="130"/>
  <line class="dashed" x1="30" y1="160" x2="150" y2="160"/>
  <line class="dashed" x1="30" y1="190" x2="150" y2="190"/>
  <!-- Grid on top -->
  <line class="dashed" x1="70" y1="70" x2="110" y2="40"/>
  <line class="dashed" x1="110" y1="70" x2="150" y2="40"/>
  <line class="dashed" x1="30" y1="55" x2="150" y2="55"/>
  <!-- Grid on right 3x5 -->
  <line class="dashed" x1="150" y1="100" x2="190" y2="70"/>
  <line class="dashed" x1="150" y1="130" x2="190" y2="100"/>
  <line class="dashed" x1="150" y1="160" x2="190" y2="130"/>
  <line class="dashed" x1="150" y1="190" x2="190" y2="160"/>
  <line class="dashed" x1="163" y1="40" x2="163" y2="190"/>
  <line class="dashed" x1="176" y1="40" x2="176" y2="190"/>
  <!-- Labels -->
  <text x="70" y="150" fill="#1565c0">Blue</text>
  <text x="85" y="55" fill="#c62828">Red</text>
  <text x="158" y="120" fill="#2e7d32">Green</text>
  <!-- Dimensions -->
  <text x="5" y="150" font-size="10" transform="rotate(-90,10,150)">3 cm</text>
  <text x="80" y="245" font-size="10">4 cm</text>
  <text x="195" y="130" font-size="10">5 cm</text>
</svg>
