<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" fill="none">
  <style>text{font-family:Arial,sans-serif;font-size:11px;fill:#333}.dashed{stroke:#999;stroke-width:1;stroke-dasharray:4,3}</style>
  <!-- Cuboid 4x3x3 isometric view -->
  <!-- Front face (Yellow, 4x3) -->
  <polygon points="30,60 150,60 150,180 30,180" fill="#fffde7" stroke="#333" stroke-width="1.5"/>
  <!-- Top face (Red, 4x3) -->
  <polygon points="30,60 150,60 190,30 70,30" fill="#ffebee" stroke="#333" stroke-width="1.5"/>
  <!-- Right face (Green, 3x3) -->
  <polygon points="150,60 190,30 190,150 150,180" fill="#e8f5e9" stroke="#333" stroke-width="1.5"/>
  <!-- Grid on front 4x3 -->
  <line class="dashed" x1="70" y1="60" x2="70" y2="180"/>
  <line class="dashed" x1="110" y1="60" x2="110" y2="180"/>
  <line class="dashed" x1="30" y1="100" x2="150" y2="100"/>
  <line class="dashed" x1="30" y1="140" x2="150" y2="140"/>
  <!-- Grid on top 4x3 -->
  <line class="dashed" x1="70" y1="60" x2="110" y2="30"/>
  <line class="dashed" x1="110" y1="60" x2="150" y2="30"/>
  <line class="dashed" x1="30" y1="44" x2="150" y2="44"/>
  <!-- Grid on right 3x3 -->
  <line class="dashed" x1="150" y1="100" x2="190" y2="70"/>
  <line class="dashed" x1="150" y1="140" x2="190" y2="110"/>
  <line class="dashed" x1="163" y1="30" x2="163" y2="150"/>
  <line class="dashed" x1="176" y1="30" x2="176" y2="150"/>
  <!-- Labels -->
  <text x="70" y="125" fill="#f57f17">Yellow</text>
  <text x="80" y="45" fill="#c62828">Red</text>
  <text x="160" y="95" fill="#2e7d32">Green</text>
  <!-- Dimensions -->
  <text x="5" y="120" font-size="10" transform="rotate(-90,10,120)">3 cm</text>
  <text x="80" y="200" font-size="10">4 cm</text>
  <text x="195" y="100" font-size="10">3 cm</text>
</svg>
