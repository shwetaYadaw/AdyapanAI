<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
  <style>text{font-family:Arial,sans-serif;font-size:11px;fill:#333}.dashed{stroke:#90caf9;stroke-width:1;stroke-dasharray:4,3}</style>
  <!-- Cube 5x5x5 all faces blue -->
  <polygon points="30,70 160,70 160,200 30,200" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <polygon points="30,70 160,70 210,30 80,30" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <polygon points="160,70 210,30 210,160 160,200" fill="#90caf9" stroke="#1565c0" stroke-width="1.5"/>
  <!-- Front grid 5x5 -->
  <line class="dashed" x1="56" y1="70" x2="56" y2="200"/>
  <line class="dashed" x1="82" y1="70" x2="82" y2="200"/>
  <line class="dashed" x1="108" y1="70" x2="108" y2="200"/>
  <line class="dashed" x1="134" y1="70" x2="134" y2="200"/>
  <line class="dashed" x1="30" y1="96" x2="160" y2="96"/>
  <line class="dashed" x1="30" y1="122" x2="160" y2="122"/>
  <line class="dashed" x1="30" y1="148" x2="160" y2="148"/>
  <line class="dashed" x1="30" y1="174" x2="160" y2="174"/>
  <!-- Top grid 5x5 -->
  <line class="dashed" x1="80" y1="70" x2="130" y2="30"/>
  <line class="dashed" x1="106" y1="70" x2="156" y2="30"/>
  <line class="dashed" x1="132" y1="70" x2="182" y2="30"/>
  <line class="dashed" x1="38" y1="50" x2="168" y2="50"/>
  <line class="dashed" x1="46" y1="40" x2="176" y2="40"/>
  <!-- Right grid 5x5 -->
  <line class="dashed" x1="160" y1="96" x2="210" y2="56"/>
  <line class="dashed" x1="160" y1="122" x2="210" y2="82"/>
  <line class="dashed" x1="160" y1="148" x2="210" y2="108"/>
  <line class="dashed" x1="160" y1="174" x2="210" y2="134"/>
  <line class="dashed" x1="170" y1="30" x2="170" y2="160"/>
  <line class="dashed" x1="180" y1="30" x2="180" y2="160"/>
  <line class="dashed" x1="190" y1="30" x2="190" y2="160"/>
  <line class="dashed" x1="200" y1="30" x2="200" y2="160"/>
  <!-- Labels -->
  <text x="75" y="25" fill="#1565c0" font-weight="bold">Blue</text>
  <text x="168" y="105" fill="#1565c0" font-weight="bold">Blue</text>
  <text x="80" y="140" fill="#1565c0" font-weight="bold">Blue</text>
  <!-- Dimensions -->
  <text x="5" y="140" font-size="10" transform="rotate(-90,10,140)">5 cm</text>
  <text x="85" y="220" font-size="10">5 cm</text>
  <text x="215" y="105" font-size="10">5 cm</text>
</svg>
