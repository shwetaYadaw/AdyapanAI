<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <style>
    text { font-family: Arial, sans-serif; font-size: 11px; fill: #333; }
    .shape { fill: none; stroke: #333; stroke-width: 1.5; }
    .label { font-size: 10px; fill: #555; }
    .num { font-size: 12px; font-weight: bold; fill: #333; }
  </style>
  <!-- Triangle = Tea -->
  <polygon class="shape" points="100,10 30,150 170,150"/>
  <!-- Circle = Coffee -->
  <circle class="shape" cx="110" cy="110" r="55"/>
  <!-- Rectangle = Wine -->
  <rect class="shape" x="40" y="70" width="140" height="80"/>
  <!-- Numbers in regions -->
  <text class="num" x="80" y="45">10</text>
  <text class="num" x="110" y="55">25</text>
  <text class="num" x="55" y="100">20</text>
  <text class="num" x="80" y="110">17</text>
  <text class="num" x="110" y="110">15</text>
  <text class="num" x="135" y="100">30</text>
  <text class="num" x="90" y="140">7</text>
  <text class="num" x="120" y="140">20</text>
  <text class="num" x="55" y="140">26</text>
  <text class="num" x="155" y="135">40</text>
  <!-- Legend -->
  <polygon points="240,30 233,43 247,43" fill="none" stroke="#333" stroke-width="1"/>
  <text x="255" y="40" class="label">→ Persons who takes tea</text>
  <circle cx="240" cy="60" r="7" fill="none" stroke="#333" stroke-width="1"/>
  <text x="255" y="63" class="label">→ Persons who takes coffee</text>
  <rect x="233" y="77" width="14" height="10" fill="none" stroke="#333" stroke-width="1"/>
  <text x="255" y="87" class="label">→ Persons who takes wine</text>
</svg>
