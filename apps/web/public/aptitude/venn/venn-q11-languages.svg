<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none">
  <style>
    text { font-family: Arial, sans-serif; font-size: 11px; fill: #333; }
    .shape { fill: none; stroke: #333; stroke-width: 1.5; }
    .label { font-size: 10px; fill: #555; }
    .num { font-size: 12px; font-weight: bold; fill: #333; }
  </style>
  <!-- Small Square = English -->
  <rect class="shape" x="100" y="20" width="100" height="100"/>
  <!-- Triangle = Marathi -->
  <polygon class="shape" points="80,30 20,180 160,180"/>
  <!-- Big Square = Telugu -->
  <rect class="shape" x="20" y="120" width="180" height="80"/>
  <!-- Circle = Hindi -->
  <circle class="shape" cx="120" cy="150" r="55"/>
  <!-- Numbers in regions -->
  <text class="num" x="140" y="45">12</text>
  <text class="num" x="110" y="65">5</text>
  <text class="num" x="80" y="80">4</text>
  <text class="num" x="100" y="105">7</text>
  <text class="num" x="75" y="120">6</text>
  <text class="num" x="100" y="145">2</text>
  <text class="num" x="60" y="160">8</text>
  <text class="num" x="130" y="165">11</text>
  <text class="num" x="30" y="185">10</text>
  <text class="num" x="140" y="145">3</text>
  <!-- Labels -->
  <text x="205" y="50" class="label">→ English</text>
  <text x="30" y="55" class="label">Marathi</text>
  <text x="60" y="210" class="label">→ Telugu</text>
  <text x="150" y="200" class="label">→ Hindi</text>
  <!-- Legend -->
  <rect x="250" y="40" width="12" height="12" fill="none" stroke="#333" stroke-width="1"/>
  <text x="267" y="50" class="label">→ Artists</text>
  <circle cx="256" cy="70" r="6" fill="none" stroke="#333" stroke-width="1"/>
  <text x="267" y="73" class="label">→ Players</text>
  <polygon points="256,90 250,100 262,100" fill="none" stroke="#333" stroke-width="1"/>
  <text x="267" y="97" class="label">→ Doctors</text>
</svg>
