<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" fill="none">
  <style>
    text { font-family: Arial, sans-serif; font-size: 11px; fill: #333; }
    .shape { fill: none; stroke: #333; stroke-width: 1.5; }
    .label { font-size: 10px; fill: #555; }
  </style>
  <!-- Rectangle = Football -->
  <rect class="shape" x="20" y="40" width="120" height="120"/>
  <!-- Rectangle = Cricket -->
  <rect class="shape" x="80" y="70" width="120" height="120"/>
  <!-- Rectangle = Kabaddi (top) -->
  <rect class="shape" x="60" y="20" width="100" height="80"/>
  <!-- Regions -->
  <text x="35" y="70">P</text>
  <text x="70" y="85">Q</text>
  <text x="120" y="55">R</text>
  <text x="70" y="140">S</text>
  <text x="110" y="130">T</text>
  <text x="160" y="130">U</text>
  <text x="35" y="150">V</text>
  <!-- Labels -->
  <text x="25" y="175" class="label">Football</text>
  <text x="130" y="195" class="label">Cricket</text>
  <text x="85" y="15" class="label">Kabaddi</text>
</svg>
