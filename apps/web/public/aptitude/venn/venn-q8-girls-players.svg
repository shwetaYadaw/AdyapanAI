<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 180" fill="none">
  <style>
    text { font-family: Arial, sans-serif; font-size: 11px; fill: #333; }
    .shape { fill: none; stroke: #333; stroke-width: 1.5; }
    .label { font-size: 10px; fill: #555; }
  </style>
  <!-- Triangle = Girls -->
  <polygon class="shape" points="60,20 20,140 100,140"/>
  <!-- Square = Players -->
  <rect class="shape" x="40" y="50" width="100" height="100"/>
  <!-- Circle = Coach -->
  <circle class="shape" cx="160" cy="90" r="50"/>
  <!-- Regions labeled -->
  <text x="35" y="90">P</text>
  <text x="65" y="100">Q</text>
  <text x="100" y="100">R</text>
  <text x="55" y="135">S</text>
  <text x="140" y="60">U</text>
  <text x="180" y="100">T</text>
  <!-- Legend -->
  <text x="220" y="50" class="label">Girls ←</text>
  <text x="220" y="80" class="label">Coach →</text>
  <text x="220" y="110" class="label">→ Players</text>
</svg>
