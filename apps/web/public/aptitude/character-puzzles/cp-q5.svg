<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 120" fill="none">
  <style>text{font-family:Arial,sans-serif;font-size:13px;fill:#333}.line{stroke:#333;stroke-width:1.5}</style>
  <!-- Arrow shape 1: top=3, left-center=15, bottom-left=27 -->
  <line class="line" x1="40" y1="20" x2="20" y2="50"/>
  <line class="line" x1="40" y1="20" x2="60" y2="50"/>
  <line class="line" x1="20" y1="50" x2="40" y2="80"/>
  <text x="32" y="15">3</text><text x="0" y="55">15</text><text x="28" y="95">27</text>
  <!-- Arrow shape 2: top=6, left-center=31, bottom-left=56 -->
  <line class="line" x1="155" y1="20" x2="135" y2="50"/>
  <line class="line" x1="155" y1="20" x2="175" y2="50"/>
  <line class="line" x1="135" y1="50" x2="155" y2="80"/>
  <text x="147" y="15">6</text><text x="112" y="55">31</text><text x="143" y="95">56</text>
  <!-- Arrow shape 3: top=9, left-center=?, bottom-left=81 -->
  <line class="line" x1="270" y1="20" x2="250" y2="50"/>
  <line class="line" x1="270" y1="20" x2="290" y2="50"/>
  <line class="line" x1="250" y1="50" x2="270" y2="80"/>
  <text x="262" y="15">9</text><text x="225" y="55" fill="#c00">?</text><text x="258" y="95">81</text>
  <text x="20" y="115" font-size="11" fill="#555">center×2 - top = bottom  →  ?×2-9=81  →  ?=45</text>
</svg>
