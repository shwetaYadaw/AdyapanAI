<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <style>text{font-family:Arial,sans-serif;font-size:13px;fill:#333}.circ{fill:#fff;stroke:#333;stroke-width:1.5}</style>
  <!-- Circle divided into 8 sectors: top=4,5; right=6,7; bottom=9,3; left=11,? -->
  <circle class="circ" cx="100" cy="100" r="70"/>
  <!-- Dividing lines -->
  <line x1="100" y1="30" x2="100" y2="170" stroke="#333" stroke-width="1"/>
  <line x1="30" y1="100" x2="170" y2="100" stroke="#333" stroke-width="1"/>
  <line x1="51" y1="51" x2="149" y2="149" stroke="#333" stroke-width="1"/>
  <line x1="149" y1="51" x2="51" y2="149" stroke="#333" stroke-width="1"/>
  <!-- Numbers in sectors -->
  <text x="88" y="52">4</text>
  <text x="110" y="52">5</text>
  <text x="148" y="85">6</text>
  <text x="148" y="115">7</text>
  <text x="110" y="153">9</text>
  <text x="88" y="153">3</text>
  <text x="45" y="115">11</text>
  <text x="45" y="85" fill="#c00">?</text>
  <text x="20" y="192" font-size="11" fill="#555">Lower=11+9+3+7=30; Upper=?+4+5+6=?+15; ?=15</text>
</svg>
