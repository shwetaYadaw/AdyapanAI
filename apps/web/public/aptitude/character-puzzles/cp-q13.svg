<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" fill="none">
  <style>text{font-family:Arial,sans-serif;font-size:13px;fill:#333}.circ{fill:#fff;stroke:#333;stroke-width:1.5}</style>
  <!-- Circle divided into 6 sectors: top-right=3, right=5, bottom-right=8, bottom-left=13, left=22, top-left=? -->
  <circle class="circ" cx="100" cy="100" r="75"/>
  <line x1="100" y1="25" x2="100" y2="175" stroke="#333" stroke-width="1"/>
  <line x1="25" y1="100" x2="175" y2="100" stroke="#333" stroke-width="1"/>
  <line x1="38" y1="50" x2="162" y2="150" stroke="#333" stroke-width="1"/>
  <line x1="162" y1="50" x2="38" y2="150" stroke="#333" stroke-width="1"/>
  <text x="113" y="55">3</text>
  <text x="148" y="103">5</text>
  <text x="113" y="155">8</text>
  <text x="65" y="155">13</text>
  <text x="38" y="103">22</text>
  <text x="65" y="55" fill="#c00">?</text>
  <text x="20" y="192" font-size="11" fill="#555">3→5→8→13→22→? (×2-1, ×2-2, ×2-3, ×2-4, ×2-5) → 39</text>
</svg>
