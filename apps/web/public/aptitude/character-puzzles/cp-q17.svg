<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 130" fill="none">
  <style>text{font-family:Arial,sans-serif;font-size:12px;fill:#333}.circ{fill:#fff;stroke:#333;stroke-width:1.5}</style>
  <!-- Circle 1: top=16, left=9, right=25, bottom=36 -->
  <circle class="circ" cx="65" cy="65" r="40"/>
  <line x1="65" y1="25" x2="65" y2="105" stroke="#333" stroke-width="1"/>
  <line x1="25" y1="65" x2="105" y2="65" stroke="#333" stroke-width="1"/>
  <text x="57" y="20">16</text><text x="108" y="68">25</text>
  <text x="10" y="68">9</text><text x="57" y="112">36</text>
  <!-- Circle 2: top=25, left=16, right=36, bottom=49 -->
  <circle class="circ" cx="190" cy="65" r="40"/>
  <line x1="190" y1="25" x2="190" y2="105" stroke="#333" stroke-width="1"/>
  <line x1="150" y1="65" x2="230" y2="65" stroke="#333" stroke-width="1"/>
  <text x="182" y="20">25</text><text x="233" y="68">36</text>
  <text x="133" y="68">16</text><text x="182" y="112">49</text>
  <!-- Circle 3: top=49, left=36, right=?, bottom=81 -->
  <circle class="circ" cx="310" cy="65" r="40"/>
  <line x1="310" y1="25" x2="310" y2="105" stroke="#333" stroke-width="1"/>
  <line x1="270" y1="65" x2="350" y2="65" stroke="#333" stroke-width="1"/>
  <text x="302" y="20">49</text><text x="353" y="68" fill="#c00">?</text>
  <text x="253" y="68">36</text><text x="302" y="112">81</text>
  <text x="20" y="125" font-size="11" fill="#555">All values are perfect squares: 9=3², 16=4², 25=5², 36=6², 49=7², 81=9² → ?=64=8²</text>
</svg>
