<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" fill="none">
  <style>text{font-family:Arial,sans-serif;font-size:13px;fill:#333}.cell{fill:#fff;stroke:#333;stroke-width:1.5}</style>
  <!-- 4x3 grid -->
  <rect class="cell" x="20" y="10" width="50" height="35"/><text x="38" y="33">2</text>
  <rect class="cell" x="70" y="10" width="50" height="35"/><text x="88" y="33">4</text>
  <rect class="cell" x="120" y="10" width="50" height="35"/><text x="138" y="33">0</text>
  <rect class="cell" x="20" y="45" width="50" height="35"/><text x="38" y="68">1</text>
  <rect class="cell" x="70" y="45" width="50" height="35"/><text x="88" y="68">2</text>
  <rect class="cell" x="120" y="45" width="50" height="35"/><text x="138" y="68">4</text>
  <rect class="cell" x="20" y="80" width="50" height="35"/><text x="38" y="103">3</text>
  <rect class="cell" x="70" y="80" width="50" height="35"/><text x="88" y="103">1</text>
  <rect class="cell" x="120" y="80" width="50" height="35"/><text x="138" y="103">3</text>
  <rect class="cell" x="20" y="115" width="50" height="35"/><text x="38" y="138">36</text>
  <rect class="cell" x="70" y="115" width="50" height="35"/><text x="84" y="138" fill="#c00">?</text>
  <rect class="cell" x="120" y="115" width="50" height="35"/><text x="138" y="138">91</text>
  <text x="20" y="170" font-size="11" fill="#555">Col sum of cubes: 2³+1³+3³=36; 0³+4³+3³=91</text>
  <text x="20" y="185" font-size="11" fill="#555">4³+2³+1³ = 64+8+1 = 73</text>
</svg>
