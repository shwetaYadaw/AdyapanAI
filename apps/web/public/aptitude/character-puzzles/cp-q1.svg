<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" fill="none">
  <style>text{font-family:Arial,sans-serif;font-size:13px;fill:#333}.cell{fill:#fff;stroke:#333;stroke-width:1.5}</style>
  <!-- 3x3 grid -->
  <rect class="cell" x="20" y="20" width="60" height="40"/><text x="38" y="47">A₂</text>
  <rect class="cell" x="80" y="20" width="60" height="40"/><text x="98" y="47">C₄</text>
  <rect class="cell" x="140" y="20" width="60" height="40"/><text x="158" y="47">E₆</text>
  <rect class="cell" x="20" y="60" width="60" height="40"/><text x="38" y="87">G₃</text>
  <rect class="cell" x="80" y="60" width="60" height="40"/><text x="98" y="87">I₅</text>
  <rect class="cell" x="140" y="60" width="60" height="40"/><text x="152" y="87" fill="#c00">?</text>
  <rect class="cell" x="20" y="100" width="60" height="40"/><text x="38" y="127">M₅</text>
  <rect class="cell" x="80" y="100" width="60" height="40"/><text x="98" y="127">O₉</text>
  <rect class="cell" x="140" y="100" width="60" height="40"/><text x="150" y="127">Q₁₄</text>
  <!-- Explanation arrows -->
  <text x="20" y="165" font-size="11" fill="#555">A₂ →+2→ C₄ →+2→ E₆ | G₃ →+2→ I₅ →+2→ K₈ | M₅ →+2→ O₉ →+2→ Q₁₄</text>
</svg>
