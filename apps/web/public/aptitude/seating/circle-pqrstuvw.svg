<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" fill="none">
  <style>text{font-family:Arial,sans-serif;font-size:12px;fill:#333}.dot{fill:#333}</style>
  <circle cx="110" cy="110" r="80" fill="none" stroke="#999" stroke-width="1.5"/>
  <!-- 7 people: Q(top), P(top-right), R(right), T(bottom-right), V(bottom), U(bottom-left), S(left), W(top-left) -->
