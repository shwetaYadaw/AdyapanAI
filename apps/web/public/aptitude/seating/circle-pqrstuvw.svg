  <circle class="dot" cx="163" cy="52" r="4"/><text x="168" y="55">P</text>
  <circle class="dot" cx="185" cy="110" r="4"/><text x="192" y="114">R</text>
  <circle class="dot" cx="163" cy="168" r="4"/><text x="168" y="172">T</text>
  <circle class="dot" cx="110" cy="190" r="4"/><text x="106" y="205">V</text>
  <circle class="dot" cx="57" cy="168" r="4"/><text x="38" y="172">U</text>
  <circle class="dot" cx="35" cy="110" r="4"/><text x="18" y="114">S</text>
  <circle class="dot" cx="57" cy="52" r="4"/><text x="37" y="50">W</text>
</svg>
