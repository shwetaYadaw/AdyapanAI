  <line x1="258" y1="98" x2="278" y2="98" stroke="#333" stroke-width="1.5"/>
  <text x="280" y="101" font-size="11">E</text>
  <text x="255" y="113" font-size="11">S</text>
  <text x="244" y="101" font-size="11">W</text>
  <text x="130" y="18" font-size="10" fill="#1565c0">Facing East (North is up)</text>
