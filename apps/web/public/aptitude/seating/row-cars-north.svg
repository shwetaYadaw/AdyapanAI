  <circle class="dot" cx="20" cy="115" r="4"/><line class="arrow" x1="26" y1="115" x2="70" y2="115"/><text x="75" y="119">Ambassador</text>
  <circle class="dot" cx="20" cy="145" r="4"/><line class="arrow" x1="26" y1="145" x2="70" y2="145"/><text x="75" y="149">Fargo</text>
  <circle class="dot" cx="20" cy="175" r="4"/><line class="arrow" x1="26" y1="175" x2="70" y2="175"/><text x="75" y="179">Cadillac</text>
  <circle class="dot" cx="20" cy="205" r="4"/><line class="arrow" x1="26" y1="205" x2="70" y2="205"/><text x="75" y="209">Mercedes</text>
