<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 270" fill="none">
  <style>
    text { font-family: Arial, sans-serif; font-size: 12px; fill: #333; }
    .line { stroke: #333; stroke-width: 1.5; }
    .dashed { stroke: #999; stroke-width: 1; stroke-dasharray: 5,3; }
    .angle { fill: none; stroke: #4CAF50; stroke-width: 1.2; }
    .label { font-size: 11px; fill: #555; }
  </style>
  <!-- Ground line -->
  <line class="line" x1="50" y1="220" x2="380" y2="220"/>
  <!-- Tower CD -->
  <line class="line" x1="330" y1="220" x2="330" y2="40"/>
  <text x="335" y="130" class="label">Tower (CD)</text>
  <text x="323" y="240">C</text>
  <text x="323" y="35">D</text>
  <!-- Observer AB (short line for person) -->
  <line class="line" x1="100" y1="220" x2="100" y2="195"/>
  <text x="85" y="240">A</text>
  <text x="85" y="190">B</text>
  <text x="105" y="210" class="label">1.6 m</text>
  <!-- Horizontal line from eye level to tower -->
  <line class="dashed" x1="100" y1="195" x2="330" y2="195"/>
  <text x="333" y="200">E</text>
  <!-- Line of sight -->
  <line class="line" x1="100" y1="195" x2="330" y2="40" stroke="#2196F3" stroke-width="1.5"/>
  <!-- Angle of elevation = 30° -->
  <path class="angle" d="M 130,195 A 30,30 0 0,0 125,180"/>
  <text x="132" y="183" font-size="10" fill="#4CAF50">30°</text>
  <!-- Distance -->
  <text x="170" y="235" class="label">AC = BE = 20√3 m</text>
  <!-- DE height -->
  <text x="335" y="120" class="label">DE = 20 m</text>
  <!-- CE = 1.6m -->
  <text x="335" y="210" class="label">CE = 1.6 m</text>
</svg>
