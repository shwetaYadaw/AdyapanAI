<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none">
  <style>
    text { font-family: Arial, sans-serif; font-size: 12px; fill: #333; }
    .line { stroke: #333; stroke-width: 1.5; }
    .dashed { stroke: #999; stroke-width: 1; stroke-dasharray: 5,3; }
    .angle { fill: none; stroke: #4CAF50; stroke-width: 1.2; }
    .label { font-size: 11px; fill: #555; }
  </style>
  <!-- Ground line -->
  <line class="line" x1="50" y1="220" x2="380" y2="220"/>
  <!-- Lighthouse AB -->
  <line class="line" x1="200" y1="220" x2="200" y2="50"/>
  <text x="205" y="140" class="label">100 m</text>
  <text x="193" y="240">B</text>
  <text x="193" y="45">A</text>
  <!-- Ship C (left) -->
  <line class="line" x1="80" y1="220" x2="200" y2="50"/>
  <text x="70" y="240">C</text>
  <!-- Ship D (right) -->
  <line class="line" x1="300" y1="220" x2="200" y2="50"/>
  <text x="295" y="240">D</text>
  <!-- Angle at C = 30° -->
  <path class="angle" d="M 95,220 A 15,15 0 0,0 90,210"/>
  <text x="95" y="212" font-size="10" fill="#4CAF50">30°</text>
  <!-- Angle at D = 45° -->
  <path class="angle" d="M 285,220 A 15,15 0 0,1 290,210"/>
  <text x="272" y="212" font-size="10" fill="#4CAF50">45°</text>
  <!-- Labels -->
  <text x="120" y="235" class="label">AC = 100√3 m</text>
  <text x="235" y="235" class="label">AD = 100 m</text>
</svg>
