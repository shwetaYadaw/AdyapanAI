<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 180" fill="none">
  <style>text{font-family:Arial,sans-serif;font-size:12px;fill:#333}.arrow{stroke:#333;stroke-width:1.5;marker-end:url(#arr)}.label{font-size:10px;fill:#555}</style>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#333"/></marker></defs>
  <!-- Left: As -->
  <text x="10" y="20" font-weight="bold">As</text>
  <text x="10" y="45">A</text><line class="arrow" x1="22" y1="40" x2="55" y2="40"/><text x="28" y="35" class="label">+2</text><text x="62" y="45">C</text>
  <text x="10" y="70">Z</text><line class="arrow" x1="22" y1="65" x2="55" y2="65" stroke-dasharray="0"/><text x="28" y="60" class="label">+2←</text><text x="62" y="70">X</text>
  <text x="10" y="95">B</text><line class="arrow" x1="22" y1="90" x2="55" y2="90"/><text x="28" y="85" class="label">+2</text><text x="62" y="95">D</text>
  <text x="10" y="120">Y</text><line class="arrow" x1="22" y1="115" x2="55" y2="115" stroke-dasharray="0"/><text x="28" y="110" class="label">+2←</text><text x="62" y="120">W</text>
  <!-- Right: Similarly -->
  <text x="200" y="20" font-weight="bold">Similarly</text>
  <text x="200" y="45">E</text><line class="arrow" x1="212" y1="40" x2="245" y2="40"/><text x="218" y="35" class="label">+2</text><text x="252" y="45">G</text>
  <text x="200" y="70">V</text><line class="arrow" x1="212" y1="65" x2="245" y2="65" stroke-dasharray="0"/><text x="218" y="60" class="label">+2←</text><text x="252" y="70">T</text>
  <text x="200" y="95">F</text><line class="arrow" x1="212" y1="90" x2="245" y2="90"/><text x="218" y="85" class="label">+2</text><text x="252" y="95">H</text>
  <text x="200" y="120">U</text><line class="arrow" x1="212" y1="115" x2="245" y2="115" stroke-dasharray="0"/><text x="218" y="110" class="label">+2←</text><text x="252" y="120">S</text>
  <text x="210" y="155" font-size="11" fill="#1565c0">EVFU → GTHS</text>
