<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" fill="none">
  <style>
    text { font-family: Arial, sans-serif; font-size: 14px; fill: #333; }
    .face { fill: #fff; stroke: #333; stroke-width: 1.5; }
    .top { fill: #f0f0f0; stroke: #333; stroke-width: 1.5; }
    .side { fill: #e0e0e0; stroke: #333; stroke-width: 1.5; }
    .dot { fill: #333; }
  </style>
  <!-- Dice 1: front=5dots, top=4dots, right=3dots -->
  <g transform="translate(10,20)">
    <polygon class="face" points="0,30 50,30 50,80 0,80"/>
    <polygon class="top" points="0,30 50,30 70,10 20,10"/>
    <polygon class="side" points="50,30 70,10 70,60 50,80"/>
    <!-- front: 5 dots -->
    <circle class="dot" cx="12" cy="40" r="3"/>
    <circle class="dot" cx="38" cy="40" r="3"/>
    <circle class="dot" cx="25" cy="55" r="3"/>
    <circle class="dot" cx="12" cy="70" r="3"/>
    <circle class="dot" cx="38" cy="70" r="3"/>
    <!-- top: 4 dots -->
    <circle class="dot" cx="26" cy="14" r="2"/>
    <circle class="dot" cx="36" cy="14" r="2"/>
    <circle class="dot" cx="46" cy="20" r="2"/>
    <circle class="dot" cx="56" cy="20" r="2"/>
    <!-- right: 3 dots -->
    <circle class="dot" cx="57" cy="38" r="2"/>
    <circle class="dot" cx="60" cy="50" r="2"/>
    <circle class="dot" cx="63" cy="62" r="2"/>
  </g>
  <!-- Dice 2: front=5dots, top=6dots, right=1dot -->
  <g transform="translate(110,20)">
    <polygon class="face" points="0,30 50,30 50,80 0,80"/>
    <polygon class="top" points="0,30 50,30 70,10 20,10"/>
    <polygon class="side" points="50,30 70,10 70,60 50,80"/>
    <!-- front: 5 dots -->
    <circle class="dot" cx="12" cy="40" r="3"/>
    <circle class="dot" cx="38" cy="40" r="3"/>
    <circle class="dot" cx="25" cy="55" r="3"/>
    <circle class="dot" cx="12" cy="70" r="3"/>
    <circle class="dot" cx="38" cy="70" r="3"/>
    <!-- top: 6 dots -->
    <circle class="dot" cx="26" cy="14" r="2"/>
    <circle class="dot" cx="36" cy="14" r="2"/>
    <circle class="dot" cx="46" cy="14" r="2"/>
    <circle class="dot" cx="26" cy="22" r="2"/>
    <circle class="dot" cx="36" cy="22" r="2"/>
    <circle class="dot" cx="46" cy="22" r="2"/>
    <!-- right: 1 dot -->
    <circle class="dot" cx="60" cy="45" r="2.5"/>
  </g>
  <!-- Dice 3: front=3dots, top=4dots, right=1dot -->
  <g transform="translate(210,20)">
    <polygon class="face" points="0,30 50,30 50,80 0,80"/>
    <polygon class="top" points="0,30 50,30 70,10 20,10"/>
    <polygon class="side" points="50,30 70,10 70,60 50,80"/>
    <!-- front: 3 dots -->
    <circle class="dot" cx="12" cy="42" r="3"/>
    <circle class="dot" cx="25" cy="55" r="3"/>
    <circle class="dot" cx="38" cy="68" r="3"/>
    <!-- top: 4 dots -->
    <circle class="dot" cx="26" cy="14" r="2"/>
    <circle class="dot" cx="36" cy="14" r="2"/>
    <circle class="dot" cx="46" cy="20" r="2"/>
    <circle class="dot" cx="56" cy="20" r="2"/>
    <!-- right: 1 dot -->
    <circle class="dot" cx="60" cy="45" r="2.5"/>
  </g>
  <!-- Dice 4: front=2dots, top=4dots, right=1dot -->
  <g transform="translate(310,20)">
    <polygon class="face" points="0,30 50,30 50,80 0,80"/>
    <polygon class="top" points="0,30 50,30 70,10 20,10"/>
    <polygon class="side" points="50,30 70,10 70,60 50,80"/>
    <!-- front: 2 dots -->
    <circle class="dot" cx="18" cy="45" r="3"/>
    <circle class="dot" cx="35" cy="65" r="3"/>
    <!-- top: 4 dots -->
    <circle class="dot" cx="26" cy="14" r="2"/>
    <circle class="dot" cx="36" cy="14" r="2"/>
    <circle class="dot" cx="46" cy="20" r="2"/>
    <circle class="dot" cx="56" cy="20" r="2"/>
    <!-- right: 1 dot -->
    <circle class="dot" cx="60" cy="45" r="2.5"/>
  </g>
</svg>
