<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" fill="none">
  <style>
    text { font-family: Arial, sans-serif; font-size: 14px; fill: #333; }
    .face { fill: #fff; stroke: #333; stroke-width: 1.5; }
    .top { fill: #f0f0f0; stroke: #333; stroke-width: 1.5; }
    .side { fill: #e0e0e0; stroke: #333; stroke-width: 1.5; }
    .dot { fill: #333; }
  </style>
  <!-- Dice 1: front=6dots, top=2dots, right=1dot -->
  <g transform="translate(10,20)">
    <polygon class="face" points="0,30 50,30 50,80 0,80"/>
    <polygon class="top" points="0,30 50,30 70,10 20,10"/>
    <polygon class="side" points="50,30 70,10 70,60 50,80"/>
    <!-- front: 6 dots -->
    <circle class="dot" cx="12" cy="40" r="3"/>
    <circle class="dot" cx="12" cy="55" r="3"/>
    <circle class="dot" cx="12" cy="70" r="3"/>
    <circle class="dot" cx="38" cy="40" r="3"/>
    <circle class="dot" cx="38" cy="55" r="3"/>
    <circle class="dot" cx="38" cy="70" r="3"/>
    <!-- top: 2 dots -->
    <circle class="dot" cx="30" cy="16" r="2.5"/>
    <circle class="dot" cx="45" cy="16" r="2.5"/>
    <!-- right: 1 dot -->
    <circle class="dot" cx="60" cy="40" r="2.5"/>
  </g>
  <!-- Dice 2: front=3dots, top=2dots, right=1dot -->
  <g transform="translate(120,20)">
    <polygon class="face" points="0,30 50,30 50,80 0,80"/>
    <polygon class="top" points="0,30 50,30 70,10 20,10"/>
    <polygon class="side" points="50,30 70,10 70,60 50,80"/>
    <!-- front: 3 dots -->
    <circle class="dot" cx="12" cy="42" r="3"/>
    <circle class="dot" cx="25" cy="55" r="3"/>
    <circle class="dot" cx="38" cy="68" r="3"/>
    <!-- top: 2 dots -->
    <circle class="dot" cx="30" cy="16" r="2.5"/>
    <circle class="dot" cx="45" cy="16" r="2.5"/>
    <!-- right: 1 dot -->
    <circle class="dot" cx="60" cy="40" r="2.5"/>
  </g>
</svg>
