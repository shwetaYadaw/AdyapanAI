<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" fill="none">
  <style>
    text { font-family: Arial, sans-serif; font-size: 14px; fill: #333; }
    .face { fill: #fff; stroke: #333; stroke-width: 1.5; }
    .top { fill: #f0f0f0; stroke: #333; stroke-width: 1.5; }
    .side { fill: #e0e0e0; stroke: #333; stroke-width: 1.5; }
  </style>
  <!-- Dice 1: front=3, top=5, right=2 -->
  <g transform="translate(10,20)">
    <polygon class="face" points="0,30 50,30 50,80 0,80"/>
    <polygon class="top" points="0,30 50,30 70,10 20,10"/>
    <polygon class="side" points="50,30 70,10 70,60 50,80"/>
    <text x="20" y="62">3</text>
    <text x="32" y="24">5</text>
    <text x="57" y="45">2</text>
  </g>
  <!-- Dice 2: front=2, top=6, right=4 -->
  <g transform="translate(110,20)">
    <polygon class="face" points="0,30 50,30 50,80 0,80"/>
    <polygon class="top" points="0,30 50,30 70,10 20,10"/>
    <polygon class="side" points="50,30 70,10 70,60 50,80"/>
    <text x="20" y="62">2</text>
    <text x="32" y="24">6</text>
    <text x="57" y="45">4</text>
  </g>
  <!-- Dice 3: front=6, top=5, right=4 -->
  <g transform="translate(210,20)">
    <polygon class="face" points="0,30 50,30 50,80 0,80"/>
    <polygon class="top" points="0,30 50,30 70,10 20,10"/>
    <polygon class="side" points="50,30 70,10 70,60 50,80"/>
    <text x="20" y="62">6</text>
    <text x="32" y="24">5</text>
    <text x="57" y="45">4</text>
  </g>
  <!-- Dice 4: front=4, top=1, right=2 -->
  <g transform="translate(310,20)">
    <polygon class="face" points="0,30 50,30 50,80 0,80"/>
    <polygon class="top" points="0,30 50,30 70,10 20,10"/>
    <polygon class="side" points="50,30 70,10 70,60 50,80"/>
    <text x="20" y="62">4</text>
    <text x="32" y="24">1</text>
    <text x="57" y="45">2</text>
  </g>
</svg>
