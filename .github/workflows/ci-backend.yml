name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/backend/**'
      - 'packages/shared/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/backend/**'
      - 'packages/shared/**'

jobs:
  # ─── STEP 0: Architectural Guard — No Mongoose ──────────────────────────────
  # This MUST pass before any other step. It prevents Mongoose from being
  # accidentally introduced. This project uses PostgreSQL (Supabase) + Prisma ONLY.
  mysql-only-guard:
    runs-on: ubuntu-latest
    name: "🛡️ No-Mongoose Architecture Guard"
    steps:
      - uses: actions/checkout@v4

      - name: "❌ Ban mongoose imports"
        run: |
          echo "Scanning for mongoose imports..."
          if grep -r --include="*.ts" "from 'mongoose'" apps/backend/src/; then
            echo "❌ FATAL: 'mongoose' import detected in source! This project uses MySQL + Prisma ONLY."
            exit 1
          fi
          if grep -r --include="*.ts" "require('mongoose')" apps/backend/src/; then
            echo "❌ FATAL: 'mongoose' require() detected in source! Use prisma instead."
            exit 1
          fi
          echo "✅ No mongoose imports found"

      - name: "❌ Ban Mongoose model imports"
        run: |
          echo "Scanning for model file imports..."
          if grep -r --include="*.ts" "from '../models/" apps/backend/src/; then
            echo "❌ FATAL: Mongoose model import detected! Use prisma.* queries instead."
            exit 1
          fi
          if grep -r --include="*.ts" "from '../../models/" apps/backend/src/; then
            echo "❌ FATAL: Mongoose model import detected! Use prisma.* queries instead."
            exit 1
          fi
          echo "✅ No Mongoose model imports found"

      - name: "❌ Ban MONGODB_URI from .env files"
        run: |
          echo "Scanning .env files for MONGODB_URI..."
          if grep -r "^MONGODB_URI=" apps/backend/.env* 2>/dev/null; then
            echo "❌ FATAL: MONGODB_URI found in .env file! Remove it — this project is MySQL-only."
            exit 1
          fi
          echo "✅ No MONGODB_URI found in .env files"

      - name: "❌ Ban mongoose from package.json"
        run: |
          echo "Checking package.json for mongoose dependency..."
          if grep '"mongoose"' apps/backend/package.json; then
            echo "❌ FATAL: mongoose found in package.json! Remove it — PostgreSQL + Prisma only."
            exit 1
          fi
          echo "✅ mongoose not in package.json"

  # ─── STEP 1: Build and Test ───────────────────────────────────────────────────
  build-and-test:
    runs-on: ubuntu-latest
    needs: mysql-only-guard
    name: "🔨 Build & Type Check"
    strategy:
      matrix:
        node-version: [20.x]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: adyapan_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma Client
        run: yarn workspace @adyapan/backend npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:test_password@localhost:5432/adyapan_test

      - name: Push Prisma schema to test DB
        run: yarn workspace @adyapan/backend npx prisma db push --skip-generate --accept-data-loss
        env:
          DATABASE_URL: postgresql://postgres:test_password@localhost:5432/adyapan_test

      - name: Type check
        run: yarn workspace @adyapan/backend tsc --noEmit
        env:
          DATABASE_URL: postgresql://postgres:test_password@localhost:5432/adyapan_test

      - name: Build
        run: yarn workspace @adyapan/backend build
        env:
          DATABASE_URL: postgresql://postgres:test_password@localhost:5432/adyapan_test

      - name: Run tests
        run: yarn workspace @adyapan/backend test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:test_password@localhost:5432/adyapan_test
          JWT_ACCESS_SECRET: test_access_secret_min_32_chars_here
          JWT_REFRESH_SECRET: test_refresh_secret_min_32_chars_here
          JWT_EMAIL_SECRET: test_email_secret
          GOOGLE_CLIENT_ID: test_google_client_id
          SMTP_USER: test@test.com
          SMTP_PASS: test_pass
          CLOUDINARY_CLOUD_NAME: test_cloud
          CLOUDINARY_API_KEY: test_key
          CLOUDINARY_API_SECRET: test_secret
          RAZORPAY_KEY_ID: test_key
          RAZORPAY_KEY_SECRET: test_secret
          RAZORPAY_WEBHOOK_SECRET: test_webhook
          STRIPE_SECRET_KEY: sk_test_xxx
          STRIPE_WEBHOOK_SECRET: whsec_test
          AI_SERVICE_API_KEY: test_ai_key
          CERTIFICATE_SECRET: test_cert_secret

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    name: "🐳 Docker Build"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/backend/Dockerfile
          push: true
          tags: |
            adyapan/backend:latest
            adyapan/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
