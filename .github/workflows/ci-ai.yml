name: AI Service CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/ai-service/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/ai-service/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: apps/ai-service
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx flake8

      - name: Lint with flake8
        working-directory: apps/ai-service
        run: flake8 app --max-line-length=120 --exclude=__pycache__

      - name: Run tests
        working-directory: apps/ai-service
        run: pytest tests/ -v --asyncio-mode=auto
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_SERVICE_API_KEY: test_api_key
          REDIS_URL: redis://localhost:6379

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push AI service image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/ai-service/Dockerfile
          push: true
          tags: |
            adyapan/ai-service:latest
            adyapan/ai-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
