<svg xmlns="http://www.w3.org/2000/svg" width="420" height="240" viewBox="0 0 420 240" role="img" aria-labelledby="title desc">
  <title id="title">Word Search matrix with no GEEK match</title>
  <desc id="desc">A three by three letter matrix in which GEEK cannot be formed.</desc>
  <rect width="420" height="240" rx="16" fill="#f8fafc"/>
  <text x="24" y="38" fill="#0f172a" font-family="Arial, sans-serif" font-size="20" font-weight="700">Word: GEEK</text>
  <text x="24" y="65" fill="#b91c1c" font-family="Arial, sans-serif" font-size="15">No valid adjacent path exists.</text>
  <g transform="translate(148 82)" stroke="#94a3b8" stroke-width="2">
    <rect width="62" height="48" fill="#fff"/><rect x="62" width="62" height="48" fill="#fee2e2"/><rect x="124" width="62" height="48" fill="#fee2e2"/>
    <rect y="48" width="62" height="48" fill="#fff"/><rect x="62" y="48" width="62" height="48" fill="#dcfce7"/><rect x="124" y="48" width="62" height="48" fill="#fee2e2"/>
    <rect y="96" width="62" height="48" fill="#fff"/><rect x="62" y="96" width="62" height="48" fill="#fff"/><rect x="124" y="96" width="62" height="48" fill="#fff"/>
  </g>
  <g fill="#0f172a" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle">
    <text x="179" y="114">T</text><text x="241" y="114">E</text><text x="303" y="114">U</text>
    <text x="179" y="162">S</text><text x="241" y="162">G</text><text x="303" y="162">K</text>
    <text x="179" y="210">T</text><text x="241" y="210">E</text><text x="303" y="210">L</text>
  </g>
  <path d="M241 154 L241 106 L303 106" fill="none" stroke="#dc2626" stroke-width="4" stroke-dasharray="7 6" stroke-linecap="round"/>
  <circle cx="241" cy="154" r="6" fill="#16a34a"/><circle cx="241" cy="106" r="6" fill="#dc2626"/><circle cx="303" cy="106" r="6" fill="#dc2626"/>
</svg>
