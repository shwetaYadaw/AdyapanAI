services:
  # Judge0 Server for code execution
  judge0_server:
    image: judge0/judge0:1.13.1
    container_name: judge0
    ports:
      - "2358:8080"
    privileged: true
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_PASSWORD: admin
      DJANGO_SUPERUSER_EMAIL: admin@judge0.local
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:7-alpine
    container_name: judge0_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:15-alpine
    container_name: judge0_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  redis_data:
  postgres_data:
