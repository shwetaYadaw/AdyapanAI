<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="500" fill="white"/>
  
  <!-- Title -->
  <text x="500" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#333">
    Container With Most Water - Example 1
  </text>
  <text x="500" y="75" font-size="16" text-anchor="middle" fill="#666">
    Array: [1,8,6,2,5,4,8,3,7] → Maximum Area: 49
  </text>
  
  <!-- Axes -->
  <line x1="80" y1="420" x2="950" y2="420" stroke="#000" stroke-width="2"/>
  <line x1="80" y1="50" x2="80" y2="420" stroke="#000" stroke-width="2"/>
  
  <!-- Grid lines and labels -->
  <g stroke="#ddd" stroke-width="1">
    <line x1="80" y1="420" x2="950" y2="420"/>
  </g>
  
  <!-- Bars (Heights) -->
  <!-- Bar 0: height=1 -->
  <rect x="95" y="405" width="80" height="15" fill="#333" stroke="#000" stroke-width="1"/>
  <text x="135" y="445" font-size="12" text-anchor="middle" fill="#333">1</text>
  
  <!-- Bar 1: height=8 -->
  <rect x="185" y="300" width="80" height="120" fill="#f00" stroke="#000" stroke-width="2"/>
  <text x="225" y="445" font-size="12" text-anchor="middle" fill="#333">8</text>
  
  <!-- Container water area (blue) -->
  <rect x="185" y="300" x2="915" y2="420" width="730" height="120" fill="#6db3f2" opacity="0.6" stroke="none"/>
  
  <!-- Bar 2: height=6 -->
  <rect x="275" y="330" width="80" height="90" fill="#333" stroke="#000" stroke-width="1"/>
  <text x="315" y="445" font-size="12" text-anchor="middle" fill="#333">6</text>
  
  <!-- Bar 3: height=2 -->
  <rect x="365" y="390" width="80" height="30" fill="#333" stroke="#000" stroke-width="1"/>
  <text x="405" y="445" font-size="12" text-anchor="middle" fill="#333">2</text>
  
  <!-- Bar 4: height=5 -->
  <rect x="455" y="345" width="80" height="75" fill="#333" stroke="#000" stroke-width="1"/>
  <text x="495" y="445" font-size="12" text-anchor="middle" fill="#333">5</text>
  
  <!-- Bar 5: height=4 -->
  <rect x="545" y="360" width="80" height="60" fill="#333" stroke="#000" stroke-width="1"/>
  <text x="585" y="445" font-size="12" text-anchor="middle" fill="#333">4</text>
  
  <!-- Bar 6: height=8 -->
  <rect x="635" y="300" width="80" height="120" fill="#333" stroke="#000" stroke-width="1"/>
  <text x="675" y="445" font-size="12" text-anchor="middle" fill="#333">8</text>
  
  <!-- Bar 7: height=3 -->
  <rect x="725" y="375" width="80" height="45" fill="#333" stroke="#000" stroke-width="1"/>
  <text x="765" y="445" font-size="12" text-anchor="middle" fill="#333">3</text>
  
  <!-- Bar 8: height=7 (Right edge) -->
  <rect x="815" y="315" width="80" height="105" fill="#f00" stroke="#000" stroke-width="2"/>
  <text x="855" y="445" font-size="12" text-anchor="middle" fill="#333">7</text>
  
  <!-- X-axis label -->
  <text x="515" y="480" font-size="14" text-anchor="middle" fill="#333">
    Index →
  </text>
  
  <!-- Y-axis label -->
  <text x="30" y="220" font-size="14" text-anchor="middle" fill="#333" transform="rotate(-90 30 220)">
    Height →
  </text>
  
  <!-- Legend -->
  <g>
    <rect x="100" y="50" width="15" height="15" fill="#f00" stroke="#000" stroke-width="1"/>
    <text x="125" y="62" font-size="12" fill="#333">Selected Bars (max area)</text>
    
    <rect x="100" y="75" width="15" height="15" fill="#6db3f2" stroke="#000" stroke-width="1"/>
    <text x="125" y="87" font-size="12" fill="#333">Water Area (49 units²)</text>
  </g>
  
  <!-- Explanation -->
  <text x="500" y="510" font-size="14" text-anchor="middle" fill="#666">
    Maximum water is trapped between indices 1 (height=8) and 8 (height=7) with width=7, giving area = min(8,7) × 7 = 7 × 7 = 49
  </text>
</svg>